name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: mock 模式端到端 smoke
        run: |
          export KEEL_MOCK=1
          export KEEL_HOME="$PWD/.smoke-home"
          KEEL="$PWD/dist/index.js"
          mkdir -p /tmp/smoke-proj && cd /tmp/smoke-proj
          node "$KEEL" run "写个 hello"
          node "$KEEL" sessions
